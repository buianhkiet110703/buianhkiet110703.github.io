html{scroll-behavior:smooth;scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Be Vietnam Pro",system-ui,sans-serif;overflow-x:clip}

h1,h2,h3{font-weight:900;line-height:1.05;letter-spacing:-.02em;margin:0;text-wrap:balance}
h2{font-size:clamp(32px,4.4vw,52px);margin-bottom:28px}

.logo{font-weight:900;font-size:20px;text-decoration:none;margin-right:auto;display:flex;align-items:center;gap:10px}
.logo i{width:14px;height:14px;border-radius:50%;background:var(--acc);display:inline-block}

.lang{display:flex;border:1.5px solid var(--line);border-radius:999px;padding:3px}
.lang button{min-width:44px;min-height:36px;border:0;border-radius:999px;background:transparent;color:var(--mute);font:600 14px "Be Vietnam Pro",sans-serif;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--ink);color:var(--bg)}

.btn:focus-visible,.chip:focus-visible,.proj:focus-visible,.lang button:focus-visible{outline:3px solid var(--acc);outline-offset:3px}

.name{font-size:clamp(52px,8.6vw,118px);line-height:.95}
.role{font-size:clamp(19px,2.1vw,25px);font-weight:600;margin-top:16px}
.role b{color:var(--acc)}
.intro p{color:var(--mute);font-size:17px;max-width:52ch}
.intro p:first-of-type{color:var(--ink)}
.open{display:inline-flex;align-items:center;gap:10px;margin-bottom:16px;padding:8px 16px;border-radius:999px;background:light-dark(#e6f6ee,#12301f);color:light-dark(#0b6b3c,#86e3b3);font-weight:600;font-size:15px}

.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px}
.field{position:relative;height:clamp(260px,40vh,420px);margin-top:clamp(28px,4vw,48px);margin-inline:calc(-1*max(5vw,16px));background:var(--soft);overflow:hidden}

@media(prefers-reduced-motion:reduce){*{transition:none!important}html{scroll-behavior:auto}}
</style>

  const body=p.parts?flow+p.parts.map(q=>'<h4>'+esc(L(q[0]))+'</h4><ul>'+L(q[1]).map(x=>'<li>'+esc(x)+'</li>').join("")+'</ul>').join(""):'<ul>'+L(p.pts).map(x=>'<li>'+esc(x)+'</li>').join("")+'</ul>';
  const links=p.links?p.links.map((l,k)=>'<a class="btn'+(k?'':' main')+'" href="'+esc(l[1])+'">'+esc(L(l[0]))+'</a>').join(""):'<a class="btn main" href="'+esc(p.gh)+'">'+esc(t("code"))+'</a>';
  $("#dlgBody").innerHTML=plate(p,i,true)+'<div class="body"><h3>'+esc(L(p.t))+'</h3><p>'+esc(L(p.d))+'</p>'+statRow(p)+body+tags(p.tags)+'<div class="cta">'+links+'</div></div>';
  try{dlg.showModal()}catch(err){dlg.setAttribute("open","")}
});
$("#close").addEventListener("click",()=>dlg.close());
dlg.addEventListener("click",e=>{if(e.target===dlg)dlg.close()});

const toast=$("#toast");let tt;
const say=m=>{toast.textContent=m;toast.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>toast.classList.remove("on"),2400)};
document.querySelectorAll("[data-dl]").forEach(btn=>btn.addEventListener("click",()=>{const a=document.createElement("a");a.href="Anh_Kiet_Bui_Resume.pdf";a.download="Anh_Kiet_Bui_Resume.pdf";document.body.appendChild(a);a.click();a.remove()}));
$("#copyMail").addEventListener("click",async()=>{try{await navigator.clipboard.writeText(EMAIL);say(t("copied")+EMAIL)}catch(e){say(EMAIL)}});

/* live flow field: data in motion, bends away from the pointer */
const field=$("#field"),cv=$("#flow"),ctx=cv.getContext("2d");
const still=matchMedia("(prefers-reduced-motion: reduce)").matches;
let W=0,H=0,pts=[],mx=-999,my=-999,tm=0;
const size=()=>{const d=Math.min(2,devicePixelRatio||1);W=field.clientWidth;H=field.clientHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);pts=Array.from({length:Math.round(W*H/900)},()=>({x:Math.random()*W,y:Math.random()*H,l:Math.random()*200}))};
const ang=(x,y)=>Math.sin(x*.0042+tm)*1.6+Math.cos(y*.006-tm*.7)*1.4+Math.sin((x+y)*.002)*1.2;
const step=()=>{
  ctx.globalCompositeOperation="destination-out";ctx.fillStyle="rgba(0,0,0,.06)";ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation="source-over";ctx.strokeStyle="#ff4a1c";ctx.lineWidth=1.6;ctx.beginPath();
  for(const p of pts){
    const a=ang(p.x,p.y);let vx=Math.cos(a)*1.4,vy=Math.sin(a)*1.4;
    const dx=p.x-mx,dy=p.y-my,d2=dx*dx+dy*dy;
    if(d2<16000){const f=(16000-d2)/16000*4,n=Math.sqrt(d2+1);vx+=dx/n*f;vy+=dy/n*f}
    ctx.moveTo(p.x,p.y);p.x+=vx;p.y+=vy;ctx.lineTo(p.x,p.y);
    if(--p.l<0||p.x<0||p.x>W||p.y<0||p.y>H){p.x=Math.random()*W;p.y=Math.random()*H;p.l=100+Math.random()*200}
  }
  ctx.stroke();tm+=.0025;
};
const loop=()=>{step();requestAnimationFrame(loop)};
const ro=new ResizeObserver(()=>{size();if(still)for(let i=0;i<160;i++)step()});
ro.observe(field);
field.addEventListener("pointermove",e=>{const b=field.getBoundingClientRect();mx=e.clientX-b.left;my=e.clientY-b.top});
field.addEventListener("pointerleave",()=>{mx=my=-999});
if(!still)requestAnimationFrame(loop);
}
</script>
